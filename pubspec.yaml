name: grain_engine
description: >-
  Flutter/Dart 原生 WASM 插件引擎：插件可用任意语言（当前提供 Rust PDK）编写，
  编译为 WASM 后在 VM 级沙箱中运行，宿主能力（HTTP/XPath/加密/日志）经
  grain import 白名单注入，支持 fuel 掐死、trap 隔离与多实例。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  wasm_run: ^0.1.0+2
  dio: ^5.11.1
  html: ^0.15.7
  xpath_selector_html_parser: ^3.0.1
  crypto: ^3.0.8

dev_dependencies:
  lints: ^5.0.0
