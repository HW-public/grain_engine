name: dart

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (root package)
        run: flutter pub get

      - name: Install dependencies (example harness)
        run: flutter pub get
        working-directory: example/harness

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze root package
        run: flutter analyze

      - name: Analyze example harness
        run: flutter analyze
        working-directory: example/harness
